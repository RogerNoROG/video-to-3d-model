<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三维重建项目</title>
  <style>
    :root { color-scheme: light; --ink:#17202b; --muted:#657184; --line:#d6dde5; --surface:#fff; --page:#edf1f4; --accent:#146c94; --accent-soft:#d9edf5; --ok:#1d6b4a; --warn:#a55d00; --danger:#a32f32; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
    button,select,input { font:inherit; }
    button { border:1px solid transparent; border-radius:5px; padding:8px 12px; color:#fff; background:var(--accent); cursor:pointer; }
    button:hover { background:#0d5879; }
    button.secondary { color:var(--ink); border-color:var(--line); background:#fff; }
    button.secondary:hover { background:#f5f8fa; }
    button.danger { color:#fff; background:var(--danger); }
    button:disabled { cursor:wait; opacity:.6; }
    .shell { max-width:1440px; margin:0 auto; padding:20px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:16px; }
    h1,h2,h3,p { margin:0; } h1 { font-size:21px; font-weight:700; } h2 { font-size:16px; } h3 { font-size:14px; }
    .project-picker { display:flex; align-items:center; gap:8px; min-width:280px; }
    .project-picker select { flex:1; min-width:0; height:36px; padding:0 9px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--ink); }
    .workspace { display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:16px; align-items:start; }
    .main-column,.side-column { display:grid; gap:16px; }
    .panel { background:var(--surface); border:1px solid var(--line); border-radius:7px; overflow:hidden; }
    .panel-head { min-height:49px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; border-bottom:1px solid var(--line); }
    .panel-body { padding:16px; }
    .status { display:inline-flex; align-items:center; min-height:24px; padding:2px 8px; border-radius:4px; font-size:12px; font-weight:650; white-space:nowrap; }
    .status.review { color:#874900; background:#fff0d8; } .status.approved { color:var(--ok); background:#def4e8; } .status.failed { color:var(--danger); background:#fce4e4; } .status.working { color:#0d5879; background:var(--accent-soft); }
    .model-workbench { display:grid; grid-template-columns:minmax(0,1fr) 245px; min-height:620px; }
    .viewer-stage { position:relative; min-height:500px; background:#dfe6ea; }
    model-viewer { width:100%; height:100%; min-height:620px; --poster-color:#dfe6ea; }
    .model-meta { position:absolute; top:14px; left:14px; max-width:calc(100% - 28px); padding:9px 11px; background:rgba(255,255,255,.92); border:1px solid rgba(156,169,181,.8); border-radius:5px; box-shadow:0 1px 3px rgba(19,32,43,.1); }
    .model-meta strong,.model-meta small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .model-meta small { color:var(--muted); margin-top:2px; }
    .artifact-rail { border-left:1px solid var(--line); background:#f8fafb; padding:12px; overflow:auto; }
    .artifact-rail h3 { margin:0 0 9px; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:0; }
    .artifact-list { display:grid; gap:7px; }
    .artifact-item { width:100%; padding:10px; text-align:left; color:var(--ink); border:1px solid var(--line); border-radius:5px; background:#fff; }
    .artifact-item:hover { background:#f2f8fb; border-color:#9cc7d8; }
    .artifact-item.active { border-color:var(--accent); box-shadow:inset 3px 0 var(--accent); background:#eef8fc; }
    .artifact-item strong,.artifact-item small { display:block; } .artifact-item strong { font-weight:650; } .artifact-item small { color:var(--muted); margin-top:3px; font-size:12px; }
    .artifact-item .tag { display:inline-block; margin-bottom:4px; color:var(--warn); font-size:11px; font-weight:700; } .artifact-item.approved .tag { color:var(--ok); }
    .viewer-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .download-link { color:var(--accent); font-weight:650; text-decoration:none; }
    .project-summary { color:var(--muted); font-size:13px; }
    .task-list { display:grid; gap:7px; }
    .task { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--line); border-radius:5px; background:#fff; }
    .task-main { min-width:0; } .task-main strong,.task-main small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .task-main small { color:var(--muted); font-size:12px; }
    .task-controls { display:flex; gap:6px; } .task-controls button { padding:5px 8px; font-size:12px; }
    .project-card-list { display:grid; gap:7px; }
    .project-card { width:100%; color:var(--ink); text-align:left; background:#fff; border:1px solid var(--line); padding:10px; }
    .project-card.active { border-color:var(--accent); background:#eef8fc; } .project-card small { display:block; color:var(--muted); margin-top:3px; }
    .upload-grid { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; }
    .dropzone { min-height:100px; padding:18px; display:flex; align-items:center; justify-content:center; text-align:center; border:2px dashed #99afbd; border-radius:6px; color:var(--muted); cursor:pointer; }
    .dropzone.active { border-color:var(--accent); background:#eef8fc; color:var(--accent); }
    .selected-file { color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    input[type=file] { display:none; }
    .job-panel[hidden], .upload-panel[hidden] { display:none; }
    .job-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:8px; margin-bottom:12px; }
    .metric { padding:9px; border:1px solid var(--line); border-radius:5px; } .metric small,.metric strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .metric small { color:var(--muted); } .metric strong { margin-top:2px; }
    .progress { height:8px; overflow:hidden; border-radius:4px; background:#e0e6ea; } .progress span { display:block; height:100%; width:0; background:var(--accent); transition:width .25s; }
    .job-line { display:flex; justify-content:space-between; gap:10px; margin-top:7px; color:var(--muted); }
    .message { margin-top:11px; padding:10px; color:#3d4d5c; background:#f5f8fa; border-radius:5px; white-space:pre-wrap; }
    .step-eta { margin-top:14px; border-top:1px solid var(--line); padding-top:11px; }
    .step-eta h3 { margin:0 0 7px; color:var(--muted); font-size:12px; font-weight:650; }
    .step-eta-list { display:grid; gap:4px; }
    .step-eta-row { display:grid; grid-template-columns:18px minmax(0,1fr) auto; align-items:center; gap:7px; min-height:28px; padding:4px 6px; border-radius:4px; color:var(--muted); }
    .step-eta-row.active { color:var(--ink); background:#edf7fb; } .step-eta-row.done { color:var(--ok); } .step-eta-row.failed { color:var(--danger); }
    .step-eta-mark { font-weight:700; text-align:center; } .step-eta-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .step-eta-time { font-size:12px; white-space:nowrap; }
    .empty { color:var(--muted); padding:8px 0; }
    @media (max-width:960px) { .workspace { grid-template-columns:1fr; } .side-column { grid-template-columns:1fr 1fr; } .model-workbench { grid-template-columns:1fr; } .artifact-rail { border-left:0; border-top:1px solid var(--line); } .artifact-list { grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); } }
    @media (max-width:620px) { .shell { padding:12px; } .topbar,.project-picker,.upload-grid { align-items:stretch; flex-direction:column; } .project-picker { min-width:0; } .side-column { grid-template-columns:1fr; } .job-grid { grid-template-columns:1fr; } .viewer-stage model-viewer { min-height:440px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1>三维重建项目</h1>
      <div class="project-picker">
        <select id="projectSelect" aria-label="选择项目"><option value="">未归档任务</option></select>
        <button id="createProject" class="secondary" type="button">新建项目</button>
      </div>
    </header>

    <div class="workspace">
      <section class="main-column">
        <section class="panel">
          <div class="panel-head"><div><h2 id="modelTitle">当前审核模型</h2><p class="project-summary" id="modelPath">正在读取项目产物</p></div><span id="modelStatus" class="status review">待审核</span></div>
          <div class="model-workbench">
            <div class="viewer-stage"><model-viewer id="modelViewer" camera-controls shadow-intensity="1" exposure="1" environment-image="neutral" loading="eager" alt="三维模型"></model-viewer><div class="model-meta"><strong id="viewerName">正在载入</strong><small id="viewerHint">当前项目的最新审核候选会优先显示</small></div></div>
            <aside class="artifact-rail"><h3>模型版本</h3><div id="artifactList" class="artifact-list"></div></aside>
          </div>
          <div class="panel-head"><span class="project-summary" id="modelNote">候选模型不会替换已批准基准。</span><div class="viewer-actions"><a id="downloadLink" class="download-link" hidden download>下载 GLB</a><button id="resetCamera" class="secondary" type="button">重置视角</button></div></div>
        </section>

        <section class="panel job-panel" id="jobPanel" hidden>
          <div class="panel-head"><h2>任务进度</h2><span id="jobStatus" class="status working">处理中</span></div>
          <div class="panel-body"><div class="job-grid"><div class="metric"><small>任务</small><strong id="jobFile">-</strong></div><div class="metric"><small>阶段</small><strong id="jobStage">-</strong></div><div class="metric"><small>进度</small><strong id="jobPercent">-</strong></div><div class="metric"><small>整体剩余时间</small><strong id="jobEta">-</strong></div><div class="metric"><small>当前步骤剩余</small><strong id="stageEta">-</strong></div></div><div class="progress"><span id="progressBar"></span></div><div class="job-line"><span id="jobId">-</span><span id="jobTime">-</span></div><div class="step-eta"><h3>流程 ETA</h3><div id="stepEtaList" class="step-eta-list"></div></div><div id="jobMessage" class="message"></div></div>
        </section>

        <section class="panel upload-panel" id="uploadPanel">
          <div class="panel-head"><h2>导入视频</h2><button id="submitVideo" type="button">开始建模</button></div>
          <div class="panel-body"><div class="upload-grid"><label id="dropzone" class="dropzone" for="fileInput">拖放视频到此处，或点击选择</label><input id="fileInput" type="file" accept="video/mp4,video/quicktime,video/x-msvideo,video/x-matroska,video/webm"><div class="selected-file" id="selectedFile">尚未选择视频</div></div></div>
        </section>
      </section>

      <aside class="side-column">
        <section class="panel"><div class="panel-head"><h2>项目</h2></div><div class="panel-body"><div id="projectCards" class="project-card-list"></div></div></section>
        <section class="panel"><div class="panel-head"><h2>视频任务</h2></div><div class="panel-body"><div id="taskList" class="task-list"></div></div></section>
      </aside>
    </div>
  </main>
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
  <script>
    // 8000 正承载已经启动的 COLMAP 任务，不能为更新流程而重启；项目操作使用
    // 可独立更新的 8001 服务。两者共享同一 storage/ 与项目索引。
    const API = 'http://127.0.0.1:8001';
    const STATUS_API = API;
    const LATEST_PATH = 'storage/yellow-cube/six-face-v1/feature-and-plane-v1/merged_six_face_feature_protected_planes.glb';
    const $ = id => document.getElementById(id);
    const state = { projects: [], projectId: 'yellow-cube', artifacts: [], activeArtifact: null, file: null, poll: null };

    function modelParams() {
      const values = new URLSearchParams(location.search).getAll('model');
      return values.map(value => { const [path, label] = value.split('|'); return { path, name: label || path.split('/').pop(), override: true }; });
    }
    function artifactUrl(index) { return `${API}/api/v1/projects/${state.projectId}/artifacts/${index}`; }
    function statusClass(approved) { return approved ? 'approved' : 'review'; }
    function statusText(approved) { return approved ? '已批准' : '待审核'; }
    function formatDuration(seconds) {
      if (seconds === null || seconds === undefined) return '正在估算';
      const value = Math.max(0, Math.round(seconds));
      if (value < 60) return `约 ${value} 秒`;
      const minutes = Math.round(value / 60);
      if (minutes < 60) return `约 ${minutes} 分钟`;
      return `约 ${Math.floor(minutes / 60)} 小时 ${minutes % 60} 分钟`;
    }
    function stepStatus(step) {
      if (step.status === 'done') return ['完成', '已完成'];
      if (step.status === 'active') return ['>', `进行中 · ${formatDuration(step.eta_seconds)}`];
      if (step.status === 'failed') return ['!', '未完成'];
      return ['·', `等待 · ${formatDuration(step.eta_seconds)}`];
    }
    function modelOrder(artifacts) {
      return artifacts.map((artifact, index) => ({...artifact, index})).sort((a,b) => {
        const rank = entry => entry.kind === 'alignment-candidate' ? 0 : entry.path === LATEST_PATH ? 1 : entry.approved ? 2 : 3;
        return rank(a) - rank(b);
      });
    }
    function selectedModel() { return state.activeArtifact || modelOrder(state.artifacts)[0] || null; }
    function setModel(entry) {
      if (!entry) return;
      state.activeArtifact = entry;
      const url = entry.override ? new URL(entry.path, location.href).href : artifactUrl(entry.index);
      $('modelViewer').src = url;
      $('modelTitle').textContent = entry.kind === 'alignment-candidate' ? '最新自动对齐候选' : entry.path === LATEST_PATH ? '当前审核模型' : entry.approved ? '已批准基准模型' : '候选模型';
      $('modelPath').textContent = entry.path;
      $('viewerName').textContent = entry.name;
      $('viewerHint').textContent = entry.kind === 'alignment-candidate' ? '由新视频自动对齐生成；未通过审核不会替换基准' : entry.path === LATEST_PATH ? '贯穿圆孔保护与外平面平滑候选' : entry.approved ? '项目的已批准基准' : '尚未批准的历史候选';
      $('modelStatus').className = `status ${statusClass(entry.approved)}`;
      $('modelStatus').textContent = statusText(entry.approved);
      $('modelNote').textContent = entry.kind === 'alignment-candidate' ? '该模型仅使用已分离主体点云；请核验孔、凹槽与棱的朝向后再批准。' : entry.path === LATEST_PATH ? '此版本优先展示；贯穿通道未被补洞或平滑。' : entry.approved ? '已批准基准不会被候选自动覆盖。' : '该候选保留用于比较，尚未批准。';
      $('downloadLink').href = url; $('downloadLink').download = entry.path.split('/').pop() || 'model.glb'; $('downloadLink').hidden = false;
      renderArtifacts();
    }
    function renderArtifacts() {
      const entries = modelParams().length ? modelParams() : modelOrder(state.artifacts);
      const list = $('artifactList'); list.replaceChildren();
      if (!entries.length) { list.innerHTML = '<div class="empty">没有可展示的模型</div>'; return; }
      entries.forEach(entry => {
        const button = document.createElement('button');
        button.type = 'button'; button.className = `artifact-item ${entry.approved ? 'approved' : ''}${state.activeArtifact && state.activeArtifact.path === entry.path ? ' active' : ''}`;
        button.innerHTML = `<span class="tag">${entry.kind === 'alignment-candidate' ? '自动对齐' : entry.path === LATEST_PATH ? '当前审核' : statusText(entry.approved)}</span><strong></strong><small></small>`;
        button.querySelector('strong').textContent = entry.name;
        button.querySelector('small').textContent = entry.path.split('/').slice(-2).join('/');
        button.onclick = () => setModel(entry); list.appendChild(button);
      });
    }
    async function json(response) { try { return await response.json(); } catch { return {}; } }
    async function fetchTaskStatus(endpoint) {
      try {
        const response = await fetch(`${STATUS_API}${endpoint}`);
        if (response.ok) return response;
      } catch (_) { /* 状态服务暂不可用时，继续使用主 API 的兼容进度。 */ }
      return fetch(`${API}${endpoint}`);
    }
    async function loadProjects() {
      const response = await fetch(`${API}/api/v1/projects`); const projects = await json(response);
      if (!response.ok) throw new Error(projects.detail || '无法读取项目');
      state.projects = projects; const select = $('projectSelect'); select.replaceChildren(new Option('未归档任务', ''));
      projects.forEach(project => select.add(new Option(project.name, project.id)));
      if (!projects.some(project => project.id === state.projectId)) state.projectId = projects[0]?.id || '';
      select.value = state.projectId; renderProjects();
    }
    function renderProjects() {
      const list = $('projectCards'); list.replaceChildren();
      state.projects.forEach(project => {
        const button = document.createElement('button'); button.type = 'button'; button.className = `project-card ${project.id === state.projectId ? 'active' : ''}`;
        button.innerHTML = '<strong></strong><small></small>'; button.querySelector('strong').textContent = project.name; button.querySelector('small').textContent = `${project.artifacts.length} 个模型 · ${project.job_ids.length} 个视频任务`;
        button.onclick = async () => { state.projectId = project.id; $('projectSelect').value = project.id; await refreshProject(); }; list.appendChild(button);
      });
    }
    async function loadArtifacts() {
      if (!state.projectId) { state.artifacts = []; renderArtifacts(); return; }
      const response = await fetch(`${API}/api/v1/projects/${state.projectId}/artifacts`); const artifacts = await json(response);
      if (!response.ok) throw new Error(artifacts.detail || '无法读取项目模型');
      state.artifacts = artifacts;
      const override = modelParams();
      state.activeArtifact = override[0] || modelOrder(artifacts)[0] || null;
      setModel(state.activeArtifact);
    }
    async function loadTasks() {
      const endpoint = state.projectId ? `/api/v1/projects/${state.projectId}/jobs` : '/api/v1/jobs';
      const response = await fetchTaskStatus(endpoint); const tasks = await json(response);
      if (!response.ok) throw new Error(tasks.detail || '无法读取任务'); renderTasks(tasks);
      const running = Array.isArray(tasks) && tasks.find(task => task.status === 'processing' || task.status === 'queued'); if (running) trackTask(running.id);
    }
    function renderTasks(tasks) {
      const list = $('taskList'); list.replaceChildren();
      if (!tasks?.length) { list.innerHTML = '<div class="empty">这个项目还没有视频任务</div>'; return; }
      tasks.slice(0, 12).forEach(task => {
        const row = document.createElement('div'); row.className = 'task'; row.innerHTML = '<div class="task-main"><strong></strong><small></small></div><div class="task-controls"></div>';
        row.querySelector('strong').textContent = task.filename; row.querySelector('small').textContent = `${task.stage} · ${task.progress}% · ${task.status === 'processing' ? `剩余 ${formatDuration(task.eta_seconds)}` : task.status}`;
        const controls = row.querySelector('.task-controls'); const preview = document.createElement('button'); preview.type = 'button'; preview.className = 'secondary'; preview.textContent = '查看'; preview.onclick = () => trackTask(task.id); controls.appendChild(preview); list.appendChild(row);
      });
    }
    function updateTask(task) {
      $('jobPanel').hidden = false; $('jobFile').textContent = task.filename || '-'; $('jobStage').textContent = task.stage || '-'; $('jobPercent').textContent = `${task.progress || 0}%`; $('jobEta').textContent = task.status === 'completed' ? '已完成' : formatDuration(task.eta_seconds); $('stageEta').textContent = task.status === 'completed' ? '已完成' : formatDuration(task.stage_eta_seconds); $('jobId').textContent = task.id || '-'; $('jobTime').textContent = task.updated_at ? new Date(task.updated_at).toLocaleString() : '-'; $('progressBar').style.width = `${task.progress || 0}%`; $('jobMessage').textContent = task.error || (task.status === 'processing' ? 'ETA 会随实际输出速度持续更新。' : `任务状态：${task.status}`);
      const node = $('jobStatus'); node.className = `status ${task.status === 'completed' ? 'approved' : task.status === 'failed' ? 'failed' : 'working'}`; node.textContent = ({completed:'已完成',failed:'失败',processing:'处理中',queued:'排队中'})[task.status] || task.status;
      const list = $('stepEtaList'); list.replaceChildren();
      (task.step_etas || []).forEach(step => {
        const [mark, text] = stepStatus(step); const row = document.createElement('div'); row.className = `step-eta-row ${step.status}`;
        row.innerHTML = '<span class="step-eta-mark"></span><span class="step-eta-label"></span><span class="step-eta-time"></span>'; row.querySelector('.step-eta-mark').textContent = mark; row.querySelector('.step-eta-label').textContent = step.label; row.querySelector('.step-eta-time').textContent = text; list.appendChild(row);
      });
      if (!list.childElementCount) list.innerHTML = '<div class="empty">正在读取流程预估</div>';
      if (task.status === 'completed' && task.result_url) { const entry = {path: task.result_url, name: `${task.filename}（单次结果）`, override:true, approved:false}; setModel(entry); }
    }
    async function trackTask(id) {
      clearTimeout(state.poll); const response = await fetchTaskStatus(`/api/v1/jobs/${id}`); const task = await json(response); if (!response.ok) return; updateTask(task);
      if (task.status === 'queued' || task.status === 'processing') state.poll = setTimeout(() => trackTask(id), 1000);
    }
    async function refreshProject() { renderProjects(); await loadArtifacts(); await loadTasks(); }
    function setFile(file) { state.file = file || null; $('selectedFile').textContent = file ? `${file.name} · ${(file.size / 1024 / 1024).toFixed(1)} MB` : '尚未选择视频'; }
    async function submitVideo() {
      if (!state.file) return; const button = $('submitVideo'); button.disabled = true;
      try {
        const activeResponse = await fetchTaskStatus(state.projectId ? `/api/v1/projects/${state.projectId}/jobs` : '/api/v1/jobs');
        const activeTasks = await json(activeResponse);
        if (Array.isArray(activeTasks) && activeTasks.some(task => task.status === 'processing' || task.status === 'queued')) {
          throw new Error('当前项目仍有视频在处理；完成后再提交下一段，系统会自动对齐并生成补细节候选。');
        }
        const body = new FormData(); body.append('video', state.file); const endpoint = state.projectId ? `/api/v1/projects/${state.projectId}/jobs` : '/api/v1/jobs'; const response = await fetch(`${API}${endpoint}`, {method:'POST', body}); const task = await json(response); if (!response.ok) throw new Error(task.detail || '无法创建任务'); trackTask(task.id); await loadTasks();
      } catch (error) { $('jobPanel').hidden = false; $('jobMessage').textContent = error.message; } finally { button.disabled = false; }
    }
    $('projectSelect').onchange = async event => { state.projectId = event.target.value; await refreshProject(); };
    $('createProject').onclick = async () => { const name = prompt('项目名称'); if (!name?.trim()) return; const response = await fetch(`${API}/api/v1/projects`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.trim()})}); const project = await json(response); if (!response.ok) return; state.projectId = project.id; await loadProjects(); await refreshProject(); };
    $('fileInput').onchange = event => setFile(event.target.files[0]);
    ['dragover','dragenter'].forEach(type => $('dropzone').addEventListener(type, event => { event.preventDefault(); $('dropzone').classList.add('active'); }));
    ['dragleave','drop'].forEach(type => $('dropzone').addEventListener(type, event => { event.preventDefault(); $('dropzone').classList.remove('active'); }));
    $('dropzone').addEventListener('drop', event => setFile(event.dataTransfer.files[0])); $('submitVideo').onclick = submitVideo;
    $('resetCamera').onclick = () => { const viewer = $('modelViewer'); const src = viewer.src; viewer.src = ''; requestAnimationFrame(() => { viewer.src = src; }); };
    (async () => {
      const direct = modelParams();
      if (direct.length) setModel(direct[0]);
      try { await loadProjects(); await refreshProject(); }
      catch (error) { if (!direct.length) $('artifactList').innerHTML = `<div class="empty">服务不可用：${error.message}</div>`; }
    })();
  </script>
</body>
</html>
